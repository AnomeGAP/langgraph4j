name: Deploy Agent Executor JDK8 

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tag: Agent Executor Version'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LangGraph4j Code
        uses: actions/checkout@v2
        with:
          fetch-depth: 0

      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: maven-settings-xml-action
        uses: whelk-io/maven-settings-xml-action@v14
        with:
          servers: '[{ "id": "nexus", "username": "admin", "password": "${{ secrets.NEXUS_PASSWORD }}" }]'


      - name: Build with Maven
        run: |
          mvn -pl agent-executor versions:set -DnewVersion=${{ github.event.inputs.tags }}
          mvn -pl agent-executor clean deploy
          
      - uses: actions/checkout@v2
      - name: Slack Notification
        if: ${{ failure() }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: tests
          SLACK_COLOR: '#3278BD'
          SLACK_MESSAGE: 'Test fails after commit pushed please check with links above.'
          SLACK_TITLE: Test Failure
          SLACK_USERNAME: Github Action
          SLACK_MSG_AUTHOR: $GITHUB_ACTOR
